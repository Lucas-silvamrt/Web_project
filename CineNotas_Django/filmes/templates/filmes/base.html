{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}CineNotas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'filmes/style.css' %}">
</head>
<body>
    <header><div class="container"><a class="marca" href="{% url 'catalogo' %}">🎬 CineNotas</a><nav><a href="{% url 'catalogo' %}">Filmes</a><a href="{% url 'relatorio' %}">Relatório</a>{% if user.is_staff %}<a href="{% url 'gerenciar' %}">Gerenciar</a>{% endif %}</nav></div></header>
    <main class="container">{% block conteudo %}{% endblock %}</main>
    <footer>Projeto simples em Django • CineNotas</footer>
</body>
</html>
